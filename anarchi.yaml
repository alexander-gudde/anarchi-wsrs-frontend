schema_version: 1
identity:
  organization: AnarchI
  component: WSRS Frontend
  canonical_name: anarchi-wsrs-frontend
  responsibility: public WSRS presentation and intake experience
  authority: presentation-only
repository:
  owner: AnarchI-Technologies
  name: anarchi-wsrs-frontend
  package: anarchi-wsrs-frontend
  visibility: private
  status: live-canonical
dependencies:
  declarations:
    - {type: runtime_dependency, target: AnarchI-Technologies/Wallet-Safety-Report-Services, purpose: same-origin WSRS API, contract: wsrs.http.v1, required: true}
  external_packages: [next]
relationships:
  consumes: [wsrs.http.v1]
  registered_in: [AnarchI-Technologies/anarchi-product-registry]
boundaries:
  owns: [public presentation, intake user experience, browser-side report interaction]
  forbidden_authority: [direct-origin-backend-selection, spine-routing, payment-settlement, report-generation, arbitrary-shell]
validation:
  deterministic: npm ci && npm run lint && npm run test && npm run build
  behavior_preservation: required
verification:
  required: {discovery: true, manifest: true, topology: true, plan: true, execution: true, stress: true, integration: true}
lineage:
  preserved_by: git-history
  retired_backend_origin: wallet-safety-report-services.onrender.com
  canonical_backend_path: /wsrs
